name: Promptr install reliability monitor

# Design (zero idle runner time):
# - GitHub's cron (every 30 minutes, also triggered from the iMac) fires whenever GitHub gets to it.
# - The plan job resolves the published Open VSX version/hash once per run and checks the registry
#   is reachable; if it is not, the run exits quietly with no test jobs instead of a burst of failures.
# - Each run looks at previous runs of this workflow to find the newest slot already attempted,
#   then runs every planned slot that has come due since then (catch-up), and exits.
# - No runner ever sleeps or waits. Runner usage is only the ~1 minute each test takes.
# - A date-seeded plan spreads 70-90 tests across all 48 half-hour slots of the day (1-3 per slot),
#   so the monitor is a steady trickle; the exact count per slot varies daily but is reproducible. Actual start times drift
#   with GitHub's schedule delays, which is acceptable for reliability monitoring.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force_count:
        description: 'Run this many tests immediately, ignoring the plan (0 = normal catch-up behavior)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: promptr-daily-health-qa
  cancel-in-progress: false

jobs:
  plan:
    name: Find scheduled checks that are due
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      matrix: ${{ steps.plan.outputs.matrix }}
      vsix_version: ${{ steps.registry.outputs.version }}
      vsix_url: ${{ steps.registry.outputs.url }}
      vsix_sha256: ${{ steps.registry.outputs.sha256 }}
    steps:
      - id: registry
        name: Resolve the published Promptr release once (and check Open VSX is reachable)
        shell: bash
        run: |
          set -euo pipefail
          registry='https://open-vsx.org/api/aryansudhir/promptr'
          if ! curl --fail --silent --show-error --location --max-time 30 "$registry" -o registry.json; then
            echo "registry_ok=false" >> "$GITHUB_OUTPUT"
            echo "Open VSX did not respond; skipping this run without scheduling tests." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="$(node -e "process.stdout.write(require('./registry.json').version)")"
          url="$(node -e "process.stdout.write(require('./registry.json').files.download)")"
          sha_url="$(node -e "process.stdout.write(require('./registry.json').files.sha256)")"
          sha="$(curl --fail --silent --show-error --location --max-time 30 "$sha_url" | tr -d '[:space:]')"
          test -n "$version" && test -n "$url" && test "${#sha}" -eq 64
          echo "registry_ok=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Published Promptr $version, sha256 $sha"
      - id: plan
        if: steps.registry.outputs.registry_ok == 'true'
        env:
          FORCE_COUNT: ${{ inputs.force_count || '0' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: daily-health-qa.yml
        shell: bash
        run: |
          set -euo pipefail
          # Collect slot ids already attempted by recent runs (from their test job names).
          gh run list --workflow "$WORKFLOW_FILE" --limit 40 --json databaseId,status,createdAt \
            --jq "[.[] | select(.databaseId != ${THIS_RUN_ID})] | .[0:24]" > runs.json
          : > attempted.txt
          for id in $(node -e "for (const r of require('./runs.json')) console.log(r.databaseId)"); do
            gh api --paginate "repos/${GH_REPO}/actions/runs/${id}/jobs" --jq '.jobs[].name' 2>/dev/null \
              | grep -oE '[0-9]{8}-s[0-9]{4}-[0-9]{2}' >> attempted.txt || true
          done
          node > plan.json <<'NODE'
          const fs = require('node:fs');
          const now = new Date();
          const forceCount = Math.max(0, Math.min(65, Number(process.env.FORCE_COUNT || 0)));
          const maxCatchUpJobs = 8;           // upper bound per run: outages recover as a trickle, not a burst
          const maxLookbackHours = 6;         // slots older than this are simply skipped
          const variants = ['manifest', 'clean-state', 'settings-isolation', 'ui-settings', 'reinstall', 'duplicate-install'];

          function planFor(date) {
            let seed = 2166136261;
            for (const byte of Buffer.from(date)) {
              seed ^= byte;
              seed = Math.imul(seed, 16777619) >>> 0;
            }
            const random = () => {
              seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
              return seed / 4294967296;
            };
            const shuffle = (values) => {
              for (let i = values.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [values[i], values[j]] = [values[j], values[i]];
              }
              return values;
            };
            // 70-90 checks spread across all 48 half-hour slots (:07 and :37), 1-3 per slot, so the
            // monitor runs as a steady trickle all day instead of hourly bursts.
            const total = 70 + Math.floor(random() * 21);
            const slots = Array.from({length: 48}, (_, i) => i); // 0 = 00:07, 1 = 00:37, ...
            const counts = Array(48).fill(1);
            for (let i = 48; i < total; i++) counts[Math.floor(random() * 48)]++;
            const jobs = [];
            for (const slot of slots) {
              const hh = String(Math.floor(slot / 2)).padStart(2, '0');
              const mm = slot % 2 ? '37' : '07';
              for (let index = 0; index < counts[slot]; index++) {
                const serial = jobs.length;
                jobs.push({
                  id: `${date.replaceAll('-', '')}-s${hh}${mm}-${String(index).padStart(2, '0')}`,
                  variant: variants[(serial + Math.floor(random() * variants.length)) % variants.length],
                  slot: `${date}T${hh}:${mm}:00Z`,
                  plannedDate: date,
                  plannedTotal: total,
                });
              }
            }
            const selectedHours = Array.from({length: 24}, (_, h) => h);
            return {date, total, selectedHours, jobs};
          }

          const isoDate = (d) => d.toISOString().slice(0, 10);
          const days = [new Date(now.getTime() - 86400000), now].map(d => planFor(isoDate(d)));
          const attempted = new Set(fs.readFileSync('attempted.txt', 'utf8').split(/\s+/).filter(Boolean));

          let jobs, mode;
          if (forceCount) {
            mode = 'force';
            jobs = days[1].jobs.slice(0, forceCount).map((job, i) => ({...job, id: `force-${Date.now()}-${i}`, variant: variants[i % variants.length]}));
          } else {
            mode = 'catch-up';
            const lookbackFloor = now.getTime() - maxLookbackHours * 3600000;
            // Never re-run a slot that any earlier run already attempted (pass or fail).
            const attemptedSlots = new Set([...attempted].map(id => id.slice(0, 14)));
            jobs = days.flatMap(p => p.jobs).filter(job => {
              const t = new Date(job.slot).getTime();
              return t <= now.getTime() && t >= lookbackFloor && !attemptedSlots.has(job.id.slice(0, 14));
            });
            // Prefer the most recent slots if there is a large backlog.
            jobs.sort((a, b) => new Date(b.slot) - new Date(a.slot));
            jobs = jobs.slice(0, maxCatchUpJobs).sort((a, b) => new Date(a.slot) - new Date(b.slot));
          }
          const plan = {
            mode,
            nowUtc: now.toISOString(),
            todayPlan: {date: days[1].date, total: days[1].total, hours: days[1].selectedHours},
            attemptedSlotIds: [...attempted].sort(),
            dueJobCount: jobs.length,
            dueSlots: [...new Set(jobs.map(j => j.slot))],
            matrix: {include: jobs},
          };
          fs.writeFileSync('plan.json', JSON.stringify(plan, null, 2));
          console.log(JSON.stringify(plan, null, 2));
          NODE
          field() { node -e "const p=require('./plan.json'); const v=p.$1; process.stdout.write(typeof v==='object'?JSON.stringify(v):String(v))"; }
          count="$(field dueJobCount)"
          echo "should_run=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(field matrix)" >> "$GITHUB_OUTPUT"
          {
            echo "## Promptr install reliability check"
            echo "- Published release under test: Promptr ${{ steps.registry.outputs.version }} (sha256 ${{ steps.registry.outputs.sha256 }})"
            echo "- Trigger: ${{ github.event_name }} (mode: $(field mode)) at $(field nowUtc)"
            echo "- Today's plan (UTC $(field todayPlan.date)): $(field todayPlan.total) checks spread over 48 half-hour slots"
            echo "- Due slots handled in this run: $(node -e "process.stdout.write(require('./plan.json').dueSlots.join(', ') || 'none')")"
            echo "- Clean-install checks in this run: $count"
            echo "- Each check installs the published release on its own fresh VM and verifies activation; no runner idles between slots."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    name: Clean install check ${{ matrix.id }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TEST_VARIANT: ${{ matrix.variant }}
      TEST_RUN: ${{ matrix.id }}
      DAILY_PLAN_DATE: ${{ matrix.plannedDate }}
      DAILY_PLANNED_TOTAL: ${{ matrix.plannedTotal }}
      PROMPTR_VSIX_URL: ${{ needs.plan.outputs.vsix_url }}
      EXPECTED_VSIX_VERSION: ${{ needs.plan.outputs.vsix_version }}
      EXPECTED_VSIX_SHA256: ${{ needs.plan.outputs.vsix_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch the published Promptr release for this check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          version="$EXPECTED_VSIX_VERSION"
          url="$PROMPTR_VSIX_URL"
          expected_sha="$EXPECTED_VSIX_SHA256"
          # One fresh download of the published VSIX per VM; version/url/sha were resolved once by the plan job.
          date -u +%Y-%m-%dT%H:%M:%SZ | tee input/download-start.txt
          curl --fail --location --retry 2 --no-keepalive \
            -H 'Cache-Control: no-cache' "$url" -o input/promptr.vsix
          date -u +%Y-%m-%dT%H:%M:%SZ | tee input/download-finished.txt
          actual_sha="$(sha256sum input/promptr.vsix | awk '{print $1}')"
          test -s input/promptr.vsix
          test "$actual_sha" = "$expected_sha"
          printf 'runner=%s\nrunner_os=%s\nrunner_arch=%s\nworkflow_run=%s\njob=%s\nvariant=%s\nversion=%s\nbytes=%s\nsha256=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$TEST_VARIANT" "$version" \
            "$(stat -c '%s' input/promptr.vsix)" "$actual_sha" | tee input/download-metadata.txt
          unzip -t input/promptr.vsix
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb scrot libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1
          npm ci --ignore-scripts
      - name: Install VS Code and run the clean-install check
        run: xvfb-run -a --server-args='-screen 0 1280x900x24' node extended-run-test.cjs
      - name: Save check report and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: install-check-${{ github.run_id }}-${{ matrix.id }}
          path: results/
          if-no-files-found: warn
          retention-days: 2
      - name: Clean up the test machine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/state" "$GITHUB_WORKSPACE/.vscode-test" \
            "$GITHUB_WORKSPACE/input" "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/results"
          for path in state .vscode-test input node_modules results; do
            test ! -e "$GITHUB_WORKSPACE/$path"
          done
          echo "Wiped test state, VS Code download, fresh VSIX, npm dependencies, and evidence from $RUNNER_NAME."
          echo 'This standard GitHub-hosted VM is decommissioned automatically after the job.'
